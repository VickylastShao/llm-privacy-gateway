name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  windows-release:
    needs: secret-scan
    runs-on: windows-latest
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: npm ci
      - run: npm run check:versions
      - run: npm run check:release
      - run: npm test
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: python -m pip install -r tests/compatibility/python/requirements.txt
      - run: python tests/compatibility/python/test_sdk_compatibility.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
      - run: cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc check advisories licenses sources
      - name: Verify real OpenAI-compatible provider
        env:
          LPG_REAL_PROTOCOL: openai
          LPG_REAL_UPSTREAM_BASE_URL: ${{ vars.OPENAI_COMPAT_SMOKE_BASE_URL }}
          LPG_REAL_UPSTREAM_API_KEY: ${{ secrets.OPENAI_COMPAT_SMOKE_API_KEY }}
          LPG_REAL_MODEL: ${{ vars.OPENAI_COMPAT_SMOKE_MODEL }}
          LPG_REAL_PORT: 17893
        run: npm run smoke:provider
      - name: Verify real Anthropic provider
        env:
          LPG_REAL_PROTOCOL: anthropic
          LPG_REAL_UPSTREAM_BASE_URL: ${{ vars.ANTHROPIC_SMOKE_BASE_URL }}
          LPG_REAL_UPSTREAM_API_KEY: ${{ secrets.ANTHROPIC_SMOKE_API_KEY }}
          LPG_REAL_MODEL: ${{ vars.ANTHROPIC_SMOKE_MODEL }}
          LPG_REAL_PORT: 17894
        run: npm run smoke:provider
      - name: Import Authenticode certificate
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD are required for a public release."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "lpg-signing-certificate.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $certificatePath -Force
          if ($null -eq $certificate -or [string]::IsNullOrWhiteSpace($certificate.Thumbprint)) {
            throw "The Authenticode certificate could not be imported."
          }
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.release.conf.json"
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 4 | Set-Content -Path $configPath -Encoding utf8
          "config=$configPath" >> $env:GITHUB_OUTPUT
      - name: Build signed Windows installer
        shell: pwsh
        run: npm run desktop:build -- --config "${{ steps.signing.outputs.config }}"
      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) { throw "signtool.exe was not found." }
          $files = @("apps/desktop/src-tauri/target/release/lpg-desktop.exe")
          $files += Get-ChildItem -Recurse apps/desktop/src-tauri/target/release/bundle -Filter *.exe | ForEach-Object FullName
          foreach ($file in $files) {
            & $signTool.FullName verify /pa /all $file
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $file" }
          }
      - name: Verify signed clean Windows installer lifecycle
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            "apps/desktop/src-tauri/target/release/bundle/nsis" `
            -Filter "*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "Signed NSIS installer was not produced." }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          $appIdentifier = (Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw |
            ConvertFrom-Json).identifier
          & ./scripts/windows-clean-install-smoke.ps1 `
            -InstallerPath $installer.FullName `
            -ExpectedSha256 $hash `
            -AppDataDirectoryName $appIdentifier `
            -RequireSigned `
            -ConfirmCleanMachine
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: apps/desktop/src-tauri/target/release/bundle
          output-file: apps/desktop/src-tauri/target/release/bundle/lpg-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $bundle = Resolve-Path apps/desktop/src-tauri/target/release/bundle
          $lines = Get-ChildItem -Recurse $bundle -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object FullName |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              $relative = [IO.Path]::GetRelativePath($bundle.Path, $_.FullName).Replace("\", "/")
              "$hash  $relative"
            }
          $manifest = Join-Path $bundle "SHA256SUMS.txt"
          [IO.File]::WriteAllText($manifest, ($lines -join "`n") + "`n", [Text.Encoding]::ASCII)
      - name: Attest Windows release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
            apps/desktop/src-tauri/target/release/bundle/lpg-sbom.spdx.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/**
