name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p activity-store --test canary_leak --locked
      - run: cargo test -p gateway --test security_shell --locked
      - run: cargo test -p gateway --test performance_budget --locked
      - run: cargo bench -p gateway --bench scan --no-run --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
      - run: cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc check advisories licenses sources
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check:versions
      - run: npm test
      - run: npm run lint
      - run: npm audit --audit-level=high
  python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r tests/compatibility/python/requirements.txt
      - run: python tests/compatibility/python/test_sdk_compatibility.py
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check:versions
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: npm run desktop:build
      - name: Verify clean Windows installer lifecycle
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            "apps/desktop/src-tauri/target/release/bundle/nsis" `
            -Filter "*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer was not produced." }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          $appIdentifier = (Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw |
            ConvertFrom-Json).identifier
          & ./scripts/windows-clean-install-smoke.ps1 `
            -InstallerPath $installer.FullName `
            -ExpectedSha256 $hash `
            -AppDataDirectoryName $appIdentifier `
            -ConfirmCleanMachine
