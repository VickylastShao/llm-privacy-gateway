[package]
name = "lpg-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
activity-service = { path = "../../../crates/activity-service" }
activity-store = { path = "../../../crates/activity-store" }
gateway = { path = "../../../crates/gateway", version = "0.1.0" }
privacy-core = { path = "../../../crates/privacy-core", version = "0.1.0" }
secret-store = { path = "../../../crates/secret-store", version = "0.1.0" }
rand = "0.9"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-build = "2"
