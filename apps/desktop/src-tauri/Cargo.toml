[package]
name = "lpg-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
activity-store = { path = "../../../crates/activity-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-build = "2"
